<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>減肥打卡月曆</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-pink-100 min-h-screen p-3">

<div class="max-w-md mx-auto">

<h1 class="text-2xl font-bold text-center mb-4">
💖 減肥打卡月曆
</h1>

<div class="flex justify-between items-center mb-4">
<button onclick="changeMonth(-1)" class="bg-pink-400 text-white px-4 py-2 rounded text-lg">←</button>
<h2 id="monthYear" class="text-lg font-semibold"></h2>
<button onclick="changeMonth(1)" class="bg-pink-400 text-white px-4 py-2 rounded text-lg">→</button>
</div>

<div class="grid grid-cols-7 gap-1 text-center font-semibold text-sm">
<div>日</div><div>一</div><div>二</div>
<div>三</div><div>四</div><div>五</div><div>六</div>
</div>

<div id="calendar" class="grid grid-cols-7 gap-1 mt-2"></div>

<div class="mt-5 p-3 bg-white rounded shadow text-center">
<h3 class="font-bold mb-2">📊 本月達標</h3>
<div id="stats" class="text-lg font-semibold"></div>
</div>

<div class="mt-6 bg-white p-4 rounded shadow">
<h3 class="font-bold mb-3 text-center">📉 體重變化曲線</h3>
<canvas id="weightChart"></canvas>
</div>

</div>

<script>
let currentDate = new Date();
let chart;

const dailyChecklist = [
"沒有吃炸物",
"沒有吃甜食",
"沒有喝含糖飲料",
"沒有喝冰飲"
];

const saturdayExtra = "一星期行機 30min x2";

function renderCalendar() {
const calendar = document.getElementById("calendar");
calendar.innerHTML = "";

const year = currentDate.getFullYear();
const month = currentDate.getMonth();
document.getElementById("monthYear").innerText =
year + "年 " + (month + 1) + "月";

const firstDay = new Date(year, month, 1).getDay();
const daysInMonth = new Date(year, month + 1, 0).getDate();

for (let i = 0; i < firstDay; i++) {
calendar.innerHTML += "<div></div>";
}

for (let day = 1; day <= daysInMonth; day++) {
const dateObj = new Date(year, month, day);
const dateKey = `${year}-${month+1}-${day}`;
const data = JSON.parse(localStorage.getItem(dateKey)) || {};
const isSaturday = dateObj.getDay() === 6;

let items = [...dailyChecklist];
if (isSaturday) items.push(saturdayExtra);

let completedCount = items.filter(item => data[item]).length;
let totalCount = items.length;

let emoji = "";

if (completedCount === totalCount && totalCount > 0) {
emoji = isSaturday ? "🔥🎉✅" : "🎉✅";
} else {
emoji = "👍".repeat(completedCount);
}

let weightIcon = data.weight ? "⚖️" : "";

let dayDiv = document.createElement("div");
dayDiv.className = `
rounded p-2 text-center text-sm 
min-h-[75px] flex flex-col justify-between
${completedCount === totalCount && totalCount > 0 ? "bg-green-200" : "bg-white"}
`;

dayDiv.innerHTML = `
<div class="font-bold">${day}</div>
<div class="text-lg">${emoji}</div>
<div>${weightIcon}</div>
`;

dayDiv.onclick = () => openChecklist(dateObj, dateKey, day);
calendar.appendChild(dayDiv);
}

updateStats();
updateChart();
}

function openChecklist(dateObj, dateKey, day) {
let data = JSON.parse(localStorage.getItem(dateKey)) || {};
const isSaturday = dateObj.getDay() === 6;

let checklistItems = [...dailyChecklist];
if (isSaturday) checklistItems.push(saturdayExtra);

let content = checklistItems.map(item => `
<label class="block mb-2 text-lg">
<input type="checkbox"
${data[item] ? "checked" : ""}
onchange="saveItem('${dateKey}','${item}',this.checked)"
class="mr-2 scale-125">
${item}
</label>
`).join("");

let weightInput = "";
if (isSaturday) {
weightInput = `
<div class="mt-3">
<label class="block font-semibold text-lg">⚖️ 本週體重 (kg)</label>
<input type="number" step="0.1"
value="${data.weight || ""}"
onchange="saveWeight('${dateKey}',this.value)"
class="w-full border rounded px-3 py-2 mt-1 text-lg">
</div>
`;
}

const modal = document.createElement("div");
modal.className = "fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-3";
modal.innerHTML = `
<div class="bg-white p-4 rounded w-full max-w-sm">
<h3 class="font-bold text-lg mb-3">第 ${day} 天 ✅</h3>
${content}
${weightInput}
<button onclick="this.closest('.fixed').remove();renderCalendar();"
class="mt-4 bg-pink-400 text-white py-2 rounded w-full text-lg">
完成
</button>
</div>
`;
document.body.appendChild(modal);
}

function saveItem(dateKey, item, value) {
let data = JSON.parse(localStorage.getItem(dateKey)) || {};
data[item] = value;
localStorage.setItem(dateKey, JSON.stringify(data));
}

function saveWeight(dateKey, value) {
let data = JSON.parse(localStorage.getItem(dateKey)) || {};
data.weight = value;
localStorage.setItem(dateKey, JSON.stringify(data));
}

function updateStats() {
const year = currentDate.getFullYear();
const month = currentDate.getMonth();
const daysInMonth = new Date(year, month + 1, 0).getDate();

let perfectDays = 0;

for (let day = 1; day <= daysInMonth; day++) {
const dateObj = new Date(year, month, day);
const dateKey = `${year}-${month+1}-${day}`;
const data = JSON.parse(localStorage.getItem(dateKey)) || {};

let items = [...dailyChecklist];
if (dateObj.getDay() === 6) items.push(saturdayExtra);

let completedCount = items.filter(item => data[item]).length;
if (completedCount === items.length && items.length > 0) {
perfectDays++;
}
}

document.getElementById("stats").innerText =
`🎉 ${perfectDays} 天全部完成！`;
}

function updateChart() {
let labels = [];
let weights = [];

for (let i = 0; i < localStorage.length; i++) {
let key = localStorage.key(i);
let data = JSON.parse(localStorage.getItem(key));
if (data.weight) {
labels.push(key);
weights.push(parseFloat(data.weight));
}
}

labels.sort();

if (chart) chart.destroy();

const ctx = document.getElementById("weightChart");

chart = new Chart(ctx, {
type: "line",
data: {
labels: labels,
datasets: [{
label: "體重 (kg)",
data: weights,
borderColor: "#ec4899",
backgroundColor: "rgba(236,72,153,0.2)",
tension: 0.3,
fill: true
}]
},
options: {
responsive: true,
plugins: {
legend: { display: false }
},
scales: {
y: { beginAtZero: false }
}
}
});
}

function changeMonth(offset) {
currentDate.setMonth(currentDate.getMonth() + offset);
renderCalendar();
}

renderCalendar();
</script>

</body>
</html>
