<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>減肥健身追蹤 Pro 3.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-pink-100 min-h-screen p-4">
<div class="max-w-5xl mx-auto">

<h1 class="text-3xl font-bold text-center mb-6">💖 減肥健身追蹤</h1>

<!-- 月份切換 -->
<div class="flex justify-between items-center mb-4">
<button onclick="changeMonth(-1)" class="bg-pink-400 text-white px-4 py-2 rounded">⬅</button>
<h2 id="monthYear" class="text-xl font-semibold"></h2>
<button onclick="changeMonth(1)" class="bg-pink-400 text-white px-4 py-2 rounded">➡</button>
</div>

<div id="calendar" class="grid grid-cols-7 gap-2 text-center mb-8"></div>

<!-- 記錄區 -->
<div id="recordSection" class="bg-white p-4 rounded shadow mb-6">

<h2 class="font-bold mb-3">📅 記錄日期</h2>
<input type="date" id="selectedDate" class="border p-2 rounded w-full mb-4">

<h3 class="font-bold mb-2">🥗 飲食</h3>
<label><input type="checkbox" id="breakfast"> 沒吃炸物</label><br>
<label><input type="checkbox" id="noSugar"> 無糖</label><br>
<label><input type="checkbox" id="water"> 沒有凍飲</label><br>

<button onclick="saveDiet()" class="mt-3 bg-green-400 text-white px-4 py-2 rounded w-full mb-4">
儲存飲食
</button>

<h3 class="font-bold mb-2">🏋 運動</h3>
<label><input type="checkbox" id="gym"> 健身</label><br>
<label><input type="checkbox" id="swim"> 游泳</label><br>
<label><input type="checkbox" id="treadmill"> 跑步機</label><br>

<button onclick="saveExercise()" class="mt-3 bg-blue-400 text-white px-4 py-2 rounded w-full mb-4">
儲存運動
</button>

<h3 class="font-bold mb-2">⚖ 體重</h3>
<input type="number" id="weight" step="0.1" placeholder="體重 (kg)"
class="border p-2 rounded w-full">

<button onclick="saveWeight()" class="mt-3 bg-pink-500 text-white px-4 py-2 rounded w-full">
儲存體重
</button>

</div>

<!-- 圖表 -->
<div class="grid md:grid-cols-2 gap-6">

<div class="bg-white p-4 rounded shadow">
<h3 class="font-bold mb-2">🏋 本月運動次數</h3>
<canvas id="exerciseChart"></canvas>
</div>

<div class="bg-white p-4 rounded shadow">
<h3 class="font-bold mb-2">🥗 飲食完成比例</h3>
<canvas id="dietChart"></canvas>
</div>

<div class="bg-white p-4 rounded shadow md:col-span-2">
<h3 class="font-bold mb-2">⚖ 體重趨勢</h3>
<canvas id="weightChart"></canvas>
</div>

</div>

<div class="bg-white p-4 rounded shadow mt-6">
<h3 class="font-bold mb-2">📊 本月分析</h3>
<p id="analysis"></p>
</div>

</div>

<script>

let currentDate = new Date()
let selectedKey = formatDate(new Date())
let data = JSON.parse(localStorage.getItem("fitnessData")) || {}

document.getElementById("selectedDate").value = selectedKey

// ✅ 修正時區版本
function formatDate(d){
let year = d.getFullYear()
let month = String(d.getMonth()+1).padStart(2,"0")
let day = String(d.getDate()).padStart(2,"0")
return `${year}-${month}-${day}`
}

function changeMonth(o){
currentDate.setMonth(currentDate.getMonth()+o)
renderCalendar()
renderCharts()
}

function renderCalendar(){
let cal = document.getElementById("calendar")
cal.innerHTML = ""

let y = currentDate.getFullYear()
let m = currentDate.getMonth()

monthYear.innerText = `${y} 年 ${m+1} 月`

let first = new Date(y,m,1).getDay()
let days = new Date(y,m+1,0).getDate()

let todayKey = formatDate(new Date())

for(let i=0;i<first;i++) cal.innerHTML += "<div></div>"

for(let d=1; d<=days; d++){

let date = new Date(y,m,d)
let key = formatDate(date)

let emoji = ""
if(data[key]){
let e = data[key]

if(e.exercise?.gym) emoji+="🏋"
if(e.exercise?.swim) emoji+="🏊"
if(e.exercise?.treadmill) emoji+="🏃"

let dietScore = Object.values(e.diet||{}).filter(v=>v).length
if(dietScore===3) emoji+="👍"
else if(dietScore>0) emoji+="💪"
}

let border = ""
if(key === todayKey) border = "border-2 border-pink-500"
if(key === selectedKey) border = "border-2 border-blue-500"

cal.innerHTML += `
<div class="bg-white p-2 rounded shadow cursor-pointer ${border}"
onclick="loadDay('${key}')">
${d}
<div>${emoji}</div>
</div>`
}
}

function loadDay(key){
selectedKey = key
document.getElementById("selectedDate").value = key

let entry = data[key] || {}

breakfast.checked = entry.diet?.breakfast || false
noSugar.checked = entry.diet?.noSugar || false
water.checked = entry.diet?.water || false

gym.checked = entry.exercise?.gym || false
swim.checked = entry.exercise?.swim || false
treadmill.checked = entry.exercise?.treadmill || false

weight.value = entry.weight || ""

renderCalendar()

window.scrollTo({
top: document.getElementById("recordSection").offsetTop - 20,
behavior: "smooth"
})
}

function getSelectedKey(){
selectedKey = document.getElementById("selectedDate").value
return selectedKey
}

function saveDiet(){
let key = getSelectedKey()
if(!data[key]) data[key] = {diet:{},exercise:{}}
data[key].diet = {
breakfast:breakfast.checked,
noSugar:noSugar.checked,
water:water.checked
}
saveAll()
}

function saveExercise(){
let key = getSelectedKey()
if(!data[key]) data[key] = {diet:{},exercise:{}}
data[key].exercise = {
gym:gym.checked,
swim:swim.checked,
treadmill:treadmill.checked
}
saveAll()
}

function saveWeight(){
let key = getSelectedKey()
if(!data[key]) data[key] = {diet:{},exercise:{}}
data[key].weight = parseFloat(weight.value)||null
saveAll()
}

function saveAll(){
localStorage.setItem("fitnessData",JSON.stringify(data))
renderCalendar()
renderCharts()
alert("已儲存 ✅")
}

let exerciseChart,dietChart,weightChart

function renderCharts(){

let gym=0,swim=0,tread=0
let full=0,partial=0
let wDates=[],wVals=[]

let m=currentDate.getMonth()
let y=currentDate.getFullYear()

for(let k in data){
let d=new Date(k)
if(d.getMonth()===m && d.getFullYear()===y){

let e=data[k]

if(e.exercise?.gym) gym++
if(e.exercise?.swim) swim++
if(e.exercise?.treadmill) tread++

let ds=Object.values(e.diet||{}).filter(v=>v).length
if(ds===3) full++
else if(ds>0) partial++

if(e.weight){
wDates.push(d.getDate())
wVals.push(e.weight)
}
}
}

if(exerciseChart) exerciseChart.destroy()
if(dietChart) dietChart.destroy()
if(weightChart) weightChart.destroy()

exerciseChart=new Chart(document.getElementById("exerciseChart"),{
type:"bar",
data:{labels:["健身","游泳","跑步機"],
datasets:[{data:[gym,swim,tread],
backgroundColor:["#f472b6","#60a5fa","#34d399"]}]}
})

dietChart=new Chart(document.getElementById("dietChart"),{
type:"doughnut",
data:{labels:["全部完成","部分完成"],
datasets:[{data:[full,partial],
backgroundColor:["#facc15","#fb923c"]}]}
})

weightChart=new Chart(document.getElementById("weightChart"),{
type:"line",
data:{labels:wDates,
datasets:[{label:"體重",data:wVals,borderColor:"#f472b6"}]}
})

analysis.innerText =
`本月健身 ${gym} 次，游泳 ${swim} 次，跑步機 ${tread} 次。
飲食完全達標 ${full} 天。
平均體重：${wVals.length?
(wVals.reduce((a,b)=>a+b,0)/wVals.length).toFixed(1)
:"尚無資料"} kg`
}

renderCalendar()
renderCharts()

</script>
</body>
</html>
